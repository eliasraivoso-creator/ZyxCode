<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070d"><title>Zyx · painel OpenCode</title>
<style>
:root{--bg:#0b0b0c;--pn:#121214;--pn2:#17171a;--ln:#26262b;--tx:#f2f2f3;--mut:#8a8a93;--or:#f97316;--ok:#34d399;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.app{display:grid;grid-template-columns:96px 1fr;grid-template-rows:64px 1fr;min-height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.ver{font-size:12px;color:var(--mut);border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:3px 9px;font-weight:400}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--pn);border-radius:99px;padding:8px 16px;font-size:14px;max-width:55vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}.dot.on{background:#fff;box-shadow:0 0 8px #fff8}.dot.off{background:var(--er)}
.ib{background:none;border:0;color:var(--mut);padding:8px;cursor:pointer;display:flex}
nav{border-right:1px solid var(--ln);padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:16px}
nav button{width:60px;height:60px;border-radius:18px;border:1px solid transparent;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
nav button.on{background:#fff;color:#000}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.body{display:grid;grid-template-columns:1fr 400px;min-width:0}
.col{padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
.side{border-left:1px solid var(--ln);padding:24px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-radius:20px;background:var(--pn)}
.strip>div{padding:16px 18px;border-left:1px solid var(--ln);min-width:0}.strip>div:first-child{border:0}
.strip .v{margin-top:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{border:1px solid var(--ln);border-radius:32px;background:radial-gradient(120% 80% at 50% 0,#1b1b1f,var(--pn));padding:26px 28px}
.globe{display:block;margin:10px auto 22px;width:150px;height:150px;opacity:.9}
.big{font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0 24px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.g2>div{padding:16px 0;border-top:1px solid var(--ln)}.g2 .v{font-size:19px;font-weight:600;margin-top:6px}.g2 .v i{color:var(--mut);font-style:normal;font-weight:400}
.acts{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.act{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;font:inherit}
.act.w{background:#fff;color:#000}.act b{display:block;letter-spacing:.14em;font-size:14px}.act small{opacity:.6;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:600 13px system-ui;letter-spacing:.1em;text-transform:uppercase;padding:12px 10px;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:#fff}
.bd{background:var(--or);color:#000;border-radius:5px;padding:0 6px;margin-left:6px;font-size:11px}
.er{border:1px solid #3a2a1c;border-left:3px solid var(--or);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(90deg,#f9731614,transparent)}
.er.n{border-color:var(--ln);border-left-color:var(--mut);background:none}
.er .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}.er .h span{color:var(--mut);font-weight:400;font-size:12px;text-align:right}
.er p{margin:8px 0 0;color:#b4b4bc;font-size:14px;word-break:break-word}
.card{border:1px solid var(--ln);background:var(--pn);border-radius:20px;padding:18px}
h3{margin:0 0 10px;font-size:15px}
input,select,textarea{width:100%;margin:5px 0 12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;font:inherit}
.bt{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.bt.w{background:#fff;color:#000;border-color:#fff;font-weight:600}.bt.d{color:var(--er)}
.row{display:flex;gap:10px;align-items:center}.g{flex:1;min-width:0}
.it{padding:12px 0;border-top:1px solid var(--ln)}.it:first-child{border:0}.t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}.msg{padding:9px 12px;border-radius:12px;margin:7px 0;white-space:pre-wrap;word-break:break-word;font-size:14px;background:var(--pn2)}
.msg.assistant{background:none;border:1px solid var(--ln)}
iframe.fr{display:block;width:100%;height:calc(100dvh - 56px - 32px - 84px);min-height:460px;border:1px solid var(--ln);border-radius:20px;background:#0a0a0a}
@media(min-width:1001px){iframe.fr{height:calc(100vh - 64px - 48px)}}
pre{background:var(--bg);border:1px solid var(--ln);padding:10px;border-radius:10px;overflow-x:auto;font-size:12px}
.tag{font-size:11px;border:1px solid var(--ok);color:var(--ok);border-radius:99px;padding:1px 8px}
.msgbar{color:var(--er);font-size:13px;padding:0 24px}
@media(max-width:1000px){
 .app{grid-template-columns:1fr;grid-template-rows:56px 1fr}header{grid-column:1}
 nav{position:fixed;z-index:5;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:var(--bg);border:0;border-top:1px solid var(--ln);gap:0}
 nav button{width:64px;height:48px;border-radius:14px}
 .body{grid-template-columns:1fr;padding-bottom:84px}.side{border:0;padding:0 16px 24px}.col{padding:16px}
 .body:has(iframe.fr){padding-bottom:0}.col:has(>iframe.fr){padding:0}
 iframe.fr{position:fixed;left:0;right:0;top:env(safe-area-inset-top);width:100%;height:calc(100dvh - 65px - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:0;z-index:7;border:0;border-radius:0}
 .strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--ln)}
 .big{font-size:52px}.acts{grid-template-columns:1fr}.hero{padding:20px;border-radius:26px}.g2{gap:0 20px}.pill{font-size:13px}.logo{font-size:19px}.ver{display:none}}

/* ===== visual novo: aurora, vidro, brilho e animações ===== */
:root{--bg:#07070d;--pn:#0f0f1acc;--pn2:#161626;--ln:#25253a;--mut:#9494ab;--ac:#8b5cf6;--ac2:#22d3ee;--ac3:#f472b6}
html,body{background:var(--bg)}body{background:transparent;min-height:100vh}
body::before,body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
body::before{background:radial-gradient(circle,var(--ac),transparent 65%);top:-30vmax;left:-20vmax}
body::after{background:radial-gradient(circle,var(--ac2),transparent 65%);bottom:-35vmax;right:-25vmax;animation-duration:28s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.2)}}
@keyframes fu{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--ac2))}}
@keyframes shine{to{background-position:200% center}}
@keyframes ping{0%{box-shadow:0 0 0 0 #34d39988}100%{box-shadow:0 0 0 12px #34d39900}}
header{background:#07070dcc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:6;border-color:#ffffff14}
.logo svg{stroke:var(--ac2);animation:glow 3s ease-in-out infinite}
.nm{background:linear-gradient(90deg,#fff,var(--ac2),var(--ac),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.pill,.ver{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:#ffffff1c}
.dot.on{background:#34d399;box-shadow:0 0 8px #34d399;animation:ping 1.8s infinite}
.ib{transition:transform .3s,color .2s}.ib:active{transform:rotate(180deg) scale(.9);color:var(--ac2)}
nav{border-color:#ffffff14}
nav button{transition:transform .2s,background .3s,color .2s}nav button:active{transform:scale(.88)}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 22px #8b5cf666}
.col>*,.side>*{animation:fu .6s cubic-bezier(.2,.8,.2,1) both}
.col>*:nth-child(2){animation-delay:.08s}.col>*:nth-child(3){animation-delay:.16s}.col>*:nth-child(4){animation-delay:.24s}.col>*:nth-child(5){animation-delay:.32s}.side>*{animation-delay:.2s}
.strip,.card,.hero,.act,.er,.it{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.strip,.card,.act{border-color:#ffffff18;background:var(--pn)}
.hero{border-color:#ffffff1c;background:radial-gradient(120% 90% at 50% 0,#8b5cf633,#0f0f1acc 70%);box-shadow:0 20px 60px #0008, inset 0 1px 0 #ffffff14}
.globe{stroke:var(--ac2);opacity:1;animation:spin 40s linear infinite;filter:drop-shadow(0 0 14px #22d3ee66)}
.big{background:linear-gradient(90deg,#fff,var(--ac2),var(--ac3),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.act{transition:transform .25s,border-color .25s,box-shadow .25s}
.act:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 30px #8b5cf633}.act:active{transform:scale(.97)}
.act.w,.bt.w{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 6px 24px #8b5cf655}
.bt{transition:transform .2s,box-shadow .2s,border-color .2s}.bt:active{transform:scale(.95)}.bt.w:hover{box-shadow:0 8px 30px #22d3ee55}
.tabs button.on{border-color:var(--ac2)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #8b5cf62e}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
iframe.fr{border-color:#ffffff18;box-shadow:0 10px 40px #0009}
#zf{display:none;position:fixed;left:96px;top:64px;right:0;bottom:0;width:calc(100% - 96px);height:calc(100dvh - 64px);border:0;background:#0a0a0a;z-index:4}
body.z #zf{display:block}
@media(max-width:1000px){#zf{left:0;width:100%;top:env(safe-area-inset-top);height:calc(100dvh - 65px - env(safe-area-inset-bottom) - env(safe-area-inset-top));z-index:7}html.kb nav{display:none}html.kb #zf{top:var(--vvt,0px);height:var(--vvh,100dvh)}}
.body{grid-template-columns:1fr}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<header><div class="logo"><svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/><path d="M8.5 9.5h7M12 9.5v6"/></svg><span class="nm">Zyx</span></div><span class="ver">v1.0.4</span>
<div class="pill"><span class="dot" id="dot"></span><span id="pt">Conectando…</span></div>
<button class="ib" onclick="refresh()" title="Atualizar"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></header>
<nav id="nav"></nav>
<div class="body"><div class="col" id="c"></div><div class="side" id="s"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const LS={g(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={url:LS.g('url','http://'+(location.hostname||'localhost')+':4096'),user:LS.g('user','opencode'),pw:LS.g('pw',''),fb:LS.g('fb','')};
let page='home',rt='erros',online=null,ver='',sess=[],status={},projs=0,U=null,errs=[],prov=null,conf=null,view=null,msg='',busy=false;
const ICON={home:'<path d="M3 11 12 3l9 8M5 9.5V21h14V9.5M10 21v-6h4v6"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n||0));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'agora':m<60?m+' min atrás':m<1440?Math.round(m/60)+' h atrás':Math.round(m/1440)+' d atrás'};
async function api(p,o={}){const h={'Content-Type':'application/json'};if(cfg.pw)h.Authorization='Basic '+btoa(cfg.user+':'+cfg.pw);
 const r=await fetch(cfg.url.replace(/\/$/,'')+p,{...o,headers:h,body:o.body?JSON.stringify(o.body):undefined});
 if(!r.ok)throw new Error(r.status+' '+p);const t=await r.text();try{return JSON.parse(t)}catch(e){return t}}
const LIM=/limit|quota|rate|429|usage|exceed/i;
async function refresh(){
 msg='';busy=true;draw();
 try{
  sess=(await api('/session')).sort((a,b)=>(b.time?.updated||0)-(a.time?.updated||0));online=true;
  try{status=await api('/session/status')}catch(e){status={}}
  try{const h=await api('/global/health');ver=h.version||''}catch(e){}
  try{projs=(await api('/project')).length}catch(e){projs=new Set(sess.map(s=>s.directory)).size}
  draw();await usage();
  if(page==='cfg'||rt==='modelos'){try{prov=await api('/config/providers');conf=await api('/config')}catch(e){}}
 }catch(e){online=false;msg='Sem conexão com o servidor ('+e.message+'). Veja a aba Ajustes.'}
 busy=false;draw();
}
async function usage(){
 U={i:0,o:0,cr:0,cw:0,cost:0};errs=[];const by={};
 const list=sess.slice(0,60);
 for(let k=0;k<list.length;k+=6){
  const res=await Promise.all(list.slice(k,k+6).map(s=>api('/session/'+s.id+'/message').then(m=>[s,m]).catch(()=>[s,[]])));
  for(const [s,ms] of res)for(const m of ms){const f=m.info;if(!f||f.role!=='assistant')continue;
   if(f.tokens){U.i+=f.tokens.input||0;U.o+=f.tokens.output||0;U.cr+=f.tokens.cache?.read||0;U.cw+=f.tokens.cache?.write||0;U.cost+=f.cost||0}
   if(f.error){const tx=f.error.data?.message||f.error.name||'Erro';const key=(f.error.name||'')+tx;
    const e=by[key]??={name:f.error.name||'Erro',tx,n:0,t:0,sid:s.id,lim:LIM.test(tx+' '+(f.error.name||''))};
    e.n++;if((f.time?.created||0)>=e.t){e.t=f.time?.created||0;e.sid=s.id}}}
 }
 errs=Object.values(by).sort((a,b)=>b.t-a.t);draw();
}
function draw(){
 $('#nav').innerHTML=[['home','home'],['sess','chat'],['cfg','tool']].map(([k,i])=>`<button class="${page===k?'on':''}" onclick="nav('${k}')">${ic(i)}</button>`).join('');
 $('#dot').className='dot '+(online?'on':online===false?'off':'');
 $('#pt').textContent=online?'Conectado · OpenCode'+(ver?' v'+ver:''):online===false?'Servidor offline':'Conectando…';
 let c='',s='';
 if(msg)c+=`<div class="msgbar" style="padding:0">${esc(msg)}</div>`;
 if(page==='home'){c+=home();s=''}
 if(page==='sess'){c+=zFrame()}
 if(page==='cfg'){c+=cfgPage()}
 $('#c').innerHTML=c;$('#s').innerHTML=s;$('#s').style.display=s?'':'none';document.body.classList.toggle('z',page==='sess');
}
const nav=k=>{page=k;view=null;msg='';if(k==='sess')zid='';draw();if(k==='cfg'&&!prov)refresh()};
function home(){
 const run=Object.values(status).filter(x=>x.type&&x.type!=='idle').length,u=U||{i:0,o:0,cr:0,cw:0,cost:0};
 const lastLim=errs.find(e=>e.lim);
 return `<div class="strip">
 <div><div class="lb">Conexão</div><div class="v">${online?'OpenCode server':'—'}</div></div>
 <div><div class="lb">Servidor</div><div class="v mono">${esc(cfg.url.replace(/^https?:\/\//,''))}</div></div>
 <div><div class="lb">Limite de uso</div><div class="v">${lastLim?ago(lastLim.t):'nenhum'}${run?` <span class="tag">${run} ativa${run>1?'s':''}</span>`:''}</div></div>
 <div><div class="lb">Tempo de uso</div><div class="v" id="tu">${fT(TU)}</div></div></div>
 <div class="hero"><div class="lb">Uso de tokens <span style="text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px">Custo est. $${u.cost.toFixed(2)}</span></div>
 <svg class="globe" viewBox="0 0 100 100" fill="none" stroke="#8a8a93" stroke-width=".5"><circle cx="50" cy="50" r="46"/><ellipse cx="50" cy="50" rx="46" ry="46"/><ellipse cx="50" cy="50" rx="30" ry="46"/><ellipse cx="50" cy="50" rx="14" ry="46"/><path d="M50 4v92M4 50h92M10 30h80M10 70h80M20 15h60M20 85h60"/><path d="M14 66Q40 78 78 38" stroke="#f2f2f3" stroke-dasharray="1 2"/><circle cx="78" cy="38" r="3" fill="#f2f2f3" stroke="none"/><circle cx="14" cy="66" r="2" fill="#8a8a93" stroke="none"/></svg>
 <div style="border-top:1px solid var(--ln);padding-top:22px"><div class="lb">Total de tokens</div><div class="big">${U?fmt(u.i+u.o+u.cr+u.cw):'…'}</div></div>
 <div class="g2"><div><div class="lb">Entrada / Saída</div><div class="v">${fmt(u.i)} <i>/</i> ${fmt(u.o)}</div></div>
 <div><div class="lb">Cache leit. / escr.</div><div class="v">${fmt(u.cr)} <i>/</i> ${fmt(u.cw)}</div></div></div></div>
 <div class="acts">
 <button class="act w" onclick="window.open(cfg.url,'_blank')"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span><b>ABRIR WEB</b><small>Interface do OpenCode</small></span></button>
 <button class="act" onclick="refresh()"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span><b>ATUALIZAR</b><small>${busy?'carregando…':'dados e uso'}</small></span></button></div>`;
}
function right(){
 const nl=errs.filter(e=>e.lim).length;
 let h=`<div class="tabs"><button class="${rt==='erros'?'on':''}" onclick="rt='erros';draw()">Erros${errs.length?`<span class="bd">${errs.length}</span>`:''}</button><button class="${rt==='modelos'?'on':''}" onclick="rt='modelos';if(!prov)refresh();draw()">Modelos</button><button class="${rt==='ativas'?'on':''}" onclick="rt='ativas';draw()">Ativas</button></div>`;
 if(rt==='erros'){
  h+=errs.map(e=>`<div class="er ${e.lim?'':'n'}"><div class="h"><div>${e.lim?'Limite de uso do provedor':esc(e.name)}</div><span>${ago(e.t)} · ×${e.n}</span></div>
   <p>${esc(e.tx)}</p>${e.lim?`<p class="mut">Aguarde o horário de liberação do provedor ou use outro modelo/provedor com cota.</p>`:''}
   <div class="row" style="margin-top:10px"><button class="bt" onclick="open_('${e.sid}')">Ver chat</button>${e.lim&&cfg.fb?`<button class="bt w" onclick="resume('${e.sid}')">Continuar c/ reserva</button>`:''}</div></div>`).join('')||'<div class="mut">Nenhum erro registrado nas sessões recentes.</div>';
  if(nl&&!cfg.fb)h+='<div class="mut">Defina um modelo reserva em Ajustes para retomar a conversa em um clique.</div>';
 }
 if(rt==='modelos'){h+=modelBox()}
 if(rt==='ativas'){const a=Object.keys(status).filter(id=>status[id].type!=='idle');
  h+=a.map(id=>{const s=sess.find(x=>x.id===id)||{};return `<div class="it"><div class="row"><div class="g t">${esc(s.title||id)}</div><button class="bt d" onclick="abort('${id}')">Parar</button></div></div>`}).join('')||'<div class="mut">Nenhuma sessão em execução.</div>';
  if(a.length)h+=`<button class="bt d" style="margin-top:12px" onclick="abortAll()">Parar todas</button>`}
 return h;
}
function opts(sel){return (prov?.providers||[]).flatMap(p=>Object.entries(p.models||{}).map(([id,m])=>{const v=p.id+'/'+id;return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(p.name)} — ${esc(m.name||id)}</option>`})).join('')}
function modelBox(){
 if(!prov||!conf)return '<div class="mut">Carregando…</div>';
 return `<div class="card"><h3>Modelo padrão</h3><div class="mut">Atual: ${esc(conf.model||'(não definido)')}</div><select id="md">${opts(conf.model)}</select><button class="bt w" onclick="setModel()">Salvar</button></div>`;
}
function sessList(){
 return `<div class="card"><div class="row"><input class="g" id="nt" placeholder="Título (opcional)" style="margin:0"><button class="bt w" onclick="newS()">Nova conversa</button></div></div>
 <div class="card">${sess.map(s=>{const st=status[s.id]?.type,run=st&&st!=='idle';return `<div class="it"><div class="row"><div class="g" onclick="open_('${s.id}')" style="cursor:pointer"><div class="t">${esc(s.title||s.id)}</div><div class="mut">${s.time?.updated?ago(s.time.updated):''}</div></div>${run?'<span class="tag">ativa</span>':''}<button class="bt" onclick="ren('${s.id}')">✎</button><button class="bt d" onclick="del('${s.id}')">🗑</button></div></div>`}).join('')||'<div class="mut">Nenhuma sessão</div>'}</div>`;
}
let pollT=null;
const stopPoll=()=>{clearInterval(pollT);pollT=null};
const fx=t=>esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,'<pre>$1</pre>');
function msgsHtml(){
 if(!view)return '';
 let h=view.msgs.map(m=>{
  const ps=m.parts||[],tx=ps.filter(p=>p.type==='text').map(p=>p.text).join('\n');
  const tl=ps.filter(p=>p.type==='tool').map(p=>`<div class="mut">🔧 ${esc(p.tool)} · ${esc(p.state?.status||'')}</div>`).join('');
  const er=m.info?.error?`<div class="er"><div class="h"><div>${esc(m.info.error.name||'Erro')}</div></div><p>${esc(m.info.error.data?.message||'')}</p></div>`:'';
  return (tx||tl||er)?`<div class="msg ${m.info.role}">${tx?fx(tx):''}${tl}${er}</div>`:''}).join('');
 if(view.wait)h+='<div class="msg assistant mut">Pensando…</div>';
 return h||'<div class="mut">Envie a primeira mensagem para começar.</div>';
}
function updMsgs(){const e=$('#ml');if(e){e.innerHTML=msgsHtml();window.scrollTo(0,document.body.scrollHeight)}}
let zid='';
var ZF=null,zl='';
function zFrame(){LS.s('zu',cfg.url);LS.s('zn',cfg.user);LS.s('zp',cfg.pw);
 if(!ZF){ZF=document.createElement('iframe');ZF.id='zf';ZF.src='zyxcode.html'+(zid?'#s='+zid:'');zl=zid;document.body.appendChild(ZF)}
 else if(zid&&zid!==zl){zl=zid;ZF.src='zyxcode.html#s='+zid}
 return ''}
function chat(){
 const s=sess.find(x=>x.id===view.id)||{},run=status[view.id]?.type&&status[view.id].type!=='idle';
 return `<div class="row"><button class="bt" onclick="stopPoll();view=null;refresh()">←</button><div class="g t" style="font-size:17px;font-weight:600">${esc(s.title||'Nova conversa')}</div>${(run||view.wait)?`<button class="bt d" onclick="abort('${view.id}')">Parar</button>`:''}</div>
 <div id="ml">${msgsHtml()}</div>
 <div class="card"><select id="sm" style="margin-top:0"><option value="">Modelo padrão do servidor</option>${opts(LS.g('selm',''))}</select>
 <textarea id="pr" rows="3" placeholder="Escreva para a IA…"></textarea><div class="row"><button class="bt w g" onclick="send()">Enviar</button></div></div>`;
}
function cfgPage(){
 return `<div class="card"><h3>Conexão com o servidor</h3><div class="lb">URL</div><input id="u" value="${esc(cfg.url)}" inputmode="url"><div class="lb">Usuário</div><input id="us" value="${esc(cfg.user)}"><div class="lb">Senha</div><input id="pw" type="password" value="${esc(cfg.pw)}"><button class="bt w" onclick="saveCfg()">Salvar e testar</button></div>
 <div class="card"><h3>Modelo reserva</h3><div class="mut">Usado no botão “Continuar c/ reserva” quando um modelo atinge o limite de uso.</div>
 <select id="fb"><option value="">(nenhum)</option>${opts(cfg.fb)}</select><button class="bt w" onclick="cfg.fb=$('#fb').value;LS.s('fb',cfg.fb);msg='Modelo reserva salvo';draw()">Salvar</button></div>
 <div class="card"><h3>Servidor</h3><div class="mut">A página não inicia o processo no PC; ela para sessões e reinicia a instância.</div>
 <div class="row" style="margin:10px 0"><button class="bt d" onclick="abortAll()">Parar todas as sessões</button><button class="bt" onclick="dispose()">Reiniciar instância</button></div>
 <div class="lb">Iniciar no PC</div><pre>OPENCODE_SERVER_PASSWORD=senha opencode serve --hostname 0.0.0.0 --cors ${esc(location.origin&&location.origin!=='null'?location.origin:'http://IP-DO-PC:8000')}</pre></div>`;
}
async function act(f){try{msg='';await f()}catch(e){msg=e.message}await refresh()}
const copy=t=>{try{navigator.clipboard.writeText(t);msg='Copiado: '+t}catch(e){msg=t}draw()};
const newS=async()=>{try{const s=await api('/session',{method:'POST',body:{title:$('#nt').value||undefined}});sess.unshift(s);await open_(s.id)}catch(e){msg=e.message;draw()}};
const del=id=>confirm('Apagar esta sessão?')&&act(()=>api('/session/'+id,{method:'DELETE'}));
const ren=id=>{const t=prompt('Novo título');t&&act(()=>api('/session/'+id,{method:'PATCH',body:{title:t}}))};
const abort=id=>act(()=>api('/session/'+id+'/abort',{method:'POST'}));
const abortAll=()=>act(async()=>{for(const id of Object.keys(status))if(status[id].type!=='idle')await api('/session/'+id+'/abort',{method:'POST'})});
const dispose=()=>confirm('Reiniciar a instância?')&&act(()=>api('/instance/dispose',{method:'POST'}));
const setModel=()=>act(()=>api('/config',{method:'PATCH',body:{model:$('#md').value}}));
function open_(id){zid=id;page='sess';view=null;draw()}
async function send(){
 const el=$('#pr');if(!el||!view||view.wait)return;const t=el.value.trim();if(!t)return;
 const id=view.id,body={parts:[{type:'text',text:t}]},sm=$('#sm').value;
 if(sm){const [p,...m]=sm.split('/');body.model={providerID:p,modelID:m.join('/')}}LS.s('selm',sm);
 el.value='';view.msgs.push({info:{role:'user'},parts:[{type:'text',text:t}]});view.wait=true;updMsgs();
 pollT=setInterval(async()=>{try{const m=await api('/session/'+id+'/message');if(view&&view.id===id){view.msgs=m;updMsgs()}}catch(e){}},1500);
 try{await api('/session/'+id+'/message',{method:'POST',body})}catch(e){msg=e.message}
 stopPoll();
 if(view&&view.id===id){try{view.msgs=await api('/session/'+id+'/message')}catch(e){}view.wait=false;
  try{sess=(await api('/session')).sort((a,b)=>(b.time?.updated||0)-(a.time?.updated||0));status=await api('/session/status')}catch(e){}
  if($('#pr')&&!$('#pr').value)draw();else updMsgs()}
}
function resume(id){const [p,...m]=cfg.fb.split('/');
 api('/session/'+id+'/message',{method:'POST',body:{model:{providerID:p,modelID:m.join('/')},parts:[{type:'text',text:'continue'}]}}).catch(e=>{msg=e.message;draw()});
 msg='Pedido enviado com '+cfg.fb;draw();setTimeout(refresh,2000)}
function saveCfg(){cfg={...cfg,url:$('#u').value.trim(),user:$('#us').value.trim()||'opencode',pw:$('#pw').value};
 LS.s('url',cfg.url);LS.s('user',cfg.user);LS.s('pw',cfg.pw);refresh()}
var TU=parseInt(LS.g('tuse','0'))||0;
function fT(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return h?h+'h '+m+'min':m?m+'min '+x+'s':x+'s'}
setInterval(()=>{if(document.visibilityState!=='visible')return;TU++;if(TU%5===0)LS.s('tuse',TU);const e=document.getElementById('tu');if(e)e.textContent=fT(TU)},1000);
addEventListener('pagehide',()=>LS.s('tuse',TU));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')LS.s('tuse',TU)});
draw();refresh();
(function(){const v=window.visualViewport;if(!v)return;let base=window.innerHeight,w=window.innerWidth;
function f(){if(window.innerWidth!==w){w=window.innerWidth;base=window.innerHeight}if(v.height>base)base=v.height;
const d=document.documentElement;d.classList.toggle('kb',base-v.height>150);d.style.setProperty('--vvh',v.height+'px');d.style.setProperty('--vvt',v.offsetTop+'px')}
v.addEventListener('resize',f);v.addEventListener('scroll',f);f()})();
</script></body></html>
